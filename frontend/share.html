<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shared file — CloudBox</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f7f7f5; }
  .card { background:white; border:1px solid #ddd; border-radius:10px; padding:30px; text-align:center; max-width:400px; }
  button { background:#3B6D11; color:white; border:none; padding:10px 18px; border-radius:6px; cursor:pointer; font-size:14px; }
</style>
</head>
<body>
<div class="card">
  <h2 id="title">Loading shared file…</h2>
  <button id="downloadBtn" style="display:none;" onclick="location.href=downloadUrl">Download</button>
</div>
<script src="config.js"></script>
<script>
  const API = API_BASE;
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  let downloadUrl = null;

  (async () => {
    const res = await fetch(`${API}/share/${token}`);
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('title').textContent = data.error || 'Link invalid or expired';
      return;
    }
    downloadUrl = data.downloadUrl;
    document.getElementById('title').textContent = `"${data.filename}" was shared with you`;
    document.getElementById('downloadBtn').style.display = 'inline-block';
  })();
</script>
</body>
</html>
